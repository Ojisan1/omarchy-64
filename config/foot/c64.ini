# OMARCHY 64 — Super+Enter easter egg. Toggle with: c64
# Does not include the active Omarchy theme; this profile is self-contained.

[main]
term=xterm-256color
font=C64 Pro Mono:size=16, JetBrainsMono Nerd Font:size=16
pad=16x16
initial-window-mode=windowed
title=OMARCHY 64
workers=0

[environment]
OMARCHY_C64=1

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=yes
blink-rate=500

[colors-dark]
# Pepto VIC-II blues: inner screen, light-blue text. Window chrome is the border.
foreground=a5a5ff
background=40318d
selection-foreground=40318d
selection-background=a5a5ff

cursor=40318d a5a5ff

# Flatten the 16 ANSI colors to C64 light-blue text so colorized tools
# (eza, git, grep) stay readable on the blue screen.
regular0=a5a5ff
regular1=a5a5ff
regular2=a5a5ff
regular3=a5a5ff
regular4=a5a5ff
regular5=a5a5ff
regular6=a5a5ff
regular7=a5a5ff

bright0=a5a5ff
bright1=a5a5ff
bright2=a5a5ff
bright3=a5a5ff
bright4=a5a5ff
bright5=a5a5ff
bright6=a5a5ff
bright7=a5a5ff

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
\x1b[13;2u=Shift+Return
\x1b[13;4u=Mod1+Shift+Return
